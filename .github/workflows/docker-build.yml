name: Docker image build

# Docker is not installed on the development host, so the image is verified here on every
# pull request: it is built, loaded locally, checked for a non-root user, and smoke-tested
# over STDIO with no TTY and no network. Nothing is pushed.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sophos-firewall-mcp:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id sophos-firewall-mcp:pr -u)"
          test "$uid" = "10001" || { echo "::error::expected uid 10001, got $uid"; exit 1; }

      - name: STDIO discovery works without a TTY and without network
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | docker run --rm -i --network none \
              -e SOPHOS_HOST=192.0.2.10 \
              -e SOPHOS_PORT=4444 \
              -e SOPHOS_API_KEY=ci-not-a-real-key \
              sophos-firewall-mcp:pr > "$RUNNER_TEMP/stdio.jsonl"

          python3 - "$RUNNER_TEMP/stdio.jsonl" <<'PY'
          import json
          import pathlib
          import sys

          lines = [
              json.loads(line)
              for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
              if line.strip()
          ]
          tools = next(line for line in lines if line.get("id") == 2)["result"]["tools"]
          assert len(tools) == 152, f"expected 152 tools, got {len(tools)}"
          print(f"tools: {len(tools)}")
          PY

      - name: The image contains no XML-era or router dependency
        run: |
          docker run --rm --entrypoint python sophos-firewall-mcp:pr - <<'PY'
          import importlib.util
          import sys

          forbidden = ["xmltodict", "fastembed", "numpy"]
          found = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          if found:
              sys.exit(f"forbidden packages present in the image: {found}")
          print("no XML/router packages in the image")
          PY
