name: Docker image build

# Docker is not installed on the development host, so the image is verified here on every
# pull request: it is built, loaded locally, checked for a non-root user, and smoke-tested
# over STDIO with no TTY and no network. Nothing is pushed.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sophos-firewall-mcp:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id sophos-firewall-mcp:pr -u)"
          test "$uid" = "10001" || { echo "::error::expected uid 10001, got $uid"; exit 1; }

      - name: STDIO discovery works without a TTY and without network
        # The driver owns the container's stdin/stdout and advances on protocol boundaries:
        # it waits for the initialize response before sending tools/list, and for the
        # tools/list response before closing stdin. No sleep, no fire-and-forget pipe.
        # 20 consecutive invocations are the repeatability check for the previously flaky job.
        run: |
          python3 scripts/docker_stdio_smoke.py \
            --image sophos-firewall-mcp:pr \
            --repeat 20

      - name: The image contains no XML-era or router dependency
        run: |
          docker run --rm -i --entrypoint python sophos-firewall-mcp:pr - <<'PY'
          import importlib.util
          import sys

          forbidden = ["xmltodict", "fastembed", "numpy"]
          found = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          if found:
              sys.exit(f"forbidden packages present in the image: {found}")
          print("no XML/router packages in the image")
          PY
