name: Lint & Type Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked dependency graph
        run: uv sync --locked

      - name: flake8
        run: uv run --no-sync flake8 src/sophos_firewall_mcp tests scripts

      - name: mypy
        run: uv run --no-sync mypy src/sophos_firewall_mcp

      - name: black
        run: uv run --no-sync black --check src tests scripts
