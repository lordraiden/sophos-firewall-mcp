name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          # requirements-dev.txt carries the test/lint toolchain, including pyyaml, which the
          # deterministic OpenAPI coverage validation (#24) needs. Full lockfile-based CI is #32.
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
