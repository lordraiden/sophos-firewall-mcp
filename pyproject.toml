[project]
name = "sophos-firewall-mcp-server"
version = "0.7.1"
description = "MCP server for the Sophos Firewall 23 (SFOS 23.0) Configuration REST API: 112 typed tools for firewall, NAT, objects, users, network and audit over STDIO"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Jelmer van der Mul"},
]
keywords = [
    "sophos",
    "firewall",
    "sfos",
    "mcp",
    "model-context-protocol",
    "security",
    "network",
    "sophos firewall 23",
    "sfos 23",
    "sophos rest api",
    "firewall automation",
    "ai agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    # Exact pin, not a range: the tool-registration seam in sophos_firewall_mcp.tools reads
    # three attributes that are not public MCP SDK API -- MCPServer._tool_manager,
    # Tool.fn_metadata.arg_model and Tool.parameters -- to publish flat arguments and a
    # closed, sanitized argument model for every tool. mcp 2.3.0 exposes no public
    # equivalent, so a different 2.x release may move those attributes and silently break
    # argument validation for all 112 tools. 2.3.0 is the only release verified against the
    # seam (tests/test_sdk_compat.py) and the latest 2.x release on PyPI. Widen this only
    # after that test passes against the new release and the release is added to the CI
    # matrix in .github/workflows/test.yml; see docs/SDK-COMPATIBILITY.md.
    "mcp==2.3.0",
    "httpx>=0.20.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "mypy>=2.4.0",
    "flake8>=7.4.1",
    "black>=26.10.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/lordraiden/sophos-firewall-mcp"
Repository = "https://github.com/lordraiden/sophos-firewall-mcp"
Issues = "https://github.com/lordraiden/sophos-firewall-mcp/issues"

[project.scripts]
sophos-firewall-mcp-server = "sophos_firewall_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sophos_firewall_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit so pytest-asyncio does not emit its deprecation warning on every run.
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Opt-in live tests against a real appliance. Skipped by default: they need SOPHOS_HOST,
    # SOPHOS_PORT and SOPHOS_API_KEY (or SOPHOS_API_KEY_FILE). Read-only with the lab key.
    "live: live appliance verification (opt-in, read-only, skipped by default)",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning"
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
