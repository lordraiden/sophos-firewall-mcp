[project]
name = "sophos-firewall-mcp-server"
version = "0.4.0"
description = "MCP server for the Sophos Firewall Configuration REST API (SFOS): typed, bounded administration tools over STDIO"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Jelmer van der Mul"},
]
keywords = ["sophos", "firewall", "sfos", "mcp", "model-context-protocol", "security", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    # >=2.3 for MCPServer (mcp.server.mcpserver); the CLI extra is development-only and is not
    # installed in the runtime image.
    "mcp>=2.3.0,<3",
    "httpx>=0.20.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "mypy>=2.4.0",
    "flake8>=7.4.1",
    "black>=26.10.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/lordraiden/sophos-firewall-mcp"
Repository = "https://github.com/lordraiden/sophos-firewall-mcp"
Issues = "https://github.com/lordraiden/sophos-firewall-mcp/issues"

[project.scripts]
sophos-firewall-mcp-server = "sophos_firewall_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sophos_firewall_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit so pytest-asyncio does not emit its deprecation warning on every run.
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Opt-in live tests against a real appliance. Skipped by default: they need SOPHOS_HOST,
    # SOPHOS_PORT and SOPHOS_API_KEY (or SOPHOS_API_KEY_FILE). Read-only with the lab key.
    "live: live appliance verification (opt-in, read-only, skipped by default)",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning"
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
