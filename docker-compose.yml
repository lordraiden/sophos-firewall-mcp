version: '3.8'

services:
  sophos-firewall-mcp:
    build: .
    image: sophos-firewall-mcp:latest
    container_name: sophos-firewall-mcp
    environment:
      - SOPHOS_HOST=${SOPHOS_HOST:-192.168.1.1}
      - SOPHOS_PORT=${SOPHOS_PORT:-4444}
      # Exactly one of SOPHOS_API_KEY / SOPHOS_API_KEY_FILE is required.
      - SOPHOS_API_KEY=${SOPHOS_API_KEY:-}
      - SOPHOS_API_KEY_FILE=${SOPHOS_API_KEY_FILE:-}
      - SOPHOS_VERIFY_SSL=${SOPHOS_VERIFY_SSL:-true}
      - SOPHOS_CA_BUNDLE=${SOPHOS_CA_BUNDLE:-}
      - SOPHOS_TIMEOUT=${SOPHOS_TIMEOUT:-30}
      - SOPHOS_READ_ONLY_MODE=${SOPHOS_READ_ONLY_MODE:-false}
    restart: unless-stopped
    stdin_open: true
