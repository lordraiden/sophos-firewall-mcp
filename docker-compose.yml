# Docker Compose for the Sophos Firewall MCP server (REST-only, STDIO).
#
# The server speaks MCP over stdin/stdout: it is not an HTTP service and publishes no port.
# `stdin_open: true` keeps the STDIO session open; `tty: false` is explicit because a TTY
# would corrupt the protocol stream.
#
# This file describes a process the MCP client launches, not a daemon. The client owns the
# lifecycle, so there is deliberately no `restart` policy: restarting would only re-spawn a
# server whose stdin has already closed, with no client attached. Launch one container per
# session from the MCP client configuration:
#
#   docker compose run --rm -T sophos-firewall-mcp
#
# `-T` disables the pseudo-TTY that `docker compose run` allocates by default, and `--rm`
# removes the container when the session ends. `docker compose up` is not the supported
# invocation: it does not attach the client's stdin/stdout to the container.
#
# Read-only by default: the shipped configuration registers no mutation tools. Set
# SOPHOS_READ_ONLY_MODE=false explicitly to expose them. That is defence in depth only --
# the Sophos administrator profile behind the API key is the actual authorization boundary.
#
# The API key is mounted as a secret file, never passed in the environment:
#   SOPHOS_API_KEY_FILE=/run/secrets/sophos_api_key
# Set SOPHOS_API_KEY_FILE on the host to the path of the key file (default ./secrets/sophos_api_key).
#
# TLS is verified by default. Only a lab appliance with a self-signed certificate needs
# SOPHOS_VERIFY_SSL=false; prefer SOPHOS_CA_BUNDLE with the appliance CA instead.
#
# SOPHOS_TOOL_DOMAINS narrows the published tool surface to the domains this deployment needs
# (firewall, nat, objects, users, network, audit). It is deliberately NOT listed in the
# environment map below: unset already means "the complete surface", and a hard-coded default
# would be a second copy of the domain list that silently narrows the surface when a domain is
# added. To publish a subset, add the line yourself (or use a compose override file):
#
#   SOPHOS_TOOL_DOMAINS: firewall,nat,objects,network,audit
#
# An empty value is a startup error, not "unset", so do not pass an empty string.

services:
  sophos-firewall-mcp:
    build: .
    image: ghcr.io/lordraiden/sophos-firewall-mcp:main
    container_name: sophos-firewall-mcp
    environment:
      SOPHOS_HOST: ${SOPHOS_HOST:?set SOPHOS_HOST to the firewall hostname or IP}
      SOPHOS_PORT: ${SOPHOS_PORT:-4444}
      SOPHOS_API_KEY_FILE: /run/secrets/sophos_api_key
      SOPHOS_VERIFY_SSL: ${SOPHOS_VERIFY_SSL:-true}
      SOPHOS_CA_BUNDLE: ${SOPHOS_CA_BUNDLE:-}
      SOPHOS_TIMEOUT: ${SOPHOS_TIMEOUT:-30}
      SOPHOS_MAX_CONCURRENCY: ${SOPHOS_MAX_CONCURRENCY:-4}
      SOPHOS_READ_ONLY_MODE: ${SOPHOS_READ_ONLY_MODE:-true}
    secrets:
      - sophos_api_key
    stdin_open: true
    tty: false
    # No `restart` policy: the MCP client owns this process (see the header).
    # The server is stateless: it needs no writable filesystem and no extra privileges.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  sophos_api_key:
    file: ${SOPHOS_API_KEY_FILE:-./secrets/sophos_api_key}
