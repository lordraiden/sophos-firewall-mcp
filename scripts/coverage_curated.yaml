  updateFirewallRuleIpv4: "accepts ruleType=firewall only; WAF variant excluded"
  createFirewallRuleIpv6: "accepts ruleType=firewall only; WAF variant excluded"
  updateFirewallRuleIpv6: "accepts ruleType=firewall only; WAF variant excluded"
  getLiveUsers: "contract declares no page params; v1 does not expose them (see live observations)"
  disconnectLiveUser: "requires liveUserId and message (1-600); destructive"
  createNetworkUser: "password is write-only; never returned"
  updateNetworkUser: "password is write-only; never returned"
  getAllServices: "`type` is an enum filter declared by the contract"
  getIpsecSiteToSiteLiveConnectionsIpv4: "live state, not configuration"
  listNetworkInterfaces: "read-only in v1"
  getNetworkInterface: "read-only in v1"
  createNetworkInterface: "VLAN only: pre-reads the interface with getNetworkInterface and rejects any type other than vlan; physical, bridge, LAG and XFRM interfaces are read-only"
  updateNetworkInterface: "VLAN only: pre-reads the interface with getNetworkInterface and rejects any type other than vlan; physical, bridge, LAG and XFRM interfaces are read-only"
  deleteNetworkInterface: "VLAN only: pre-reads the interface with getNetworkInterface and rejects any type other than vlan; physical, bridge, LAG and XFRM interfaces are read-only"
