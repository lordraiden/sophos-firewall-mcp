  getCellularWanStatus: "read-only status; not a general firewall health check"

# ---------------------------------------------------------------------------
# Composite tools. They reuse audited operations from tool_map and add no new
# Sophos endpoint. The domain issues own the implementation; the operationIds
# below are the intended composition.
# ---------------------------------------------------------------------------
composite_tools:
  - name: firewall_rule_set_enabled_ipv4
    domain: firewall_rules
    kind: mutation
    operation_ids: ["updateFirewallRuleIpv4"]
    description: >-
      Enable or disable an IPv4 firewall rule by PATCHing `enabled`; reuses
      `updateFirewallRuleIpv4` and adds no new endpoint.

  - name: firewall_rule_set_enabled_ipv6
    domain: firewall_rules
    kind: mutation
    operation_ids: ["updateFirewallRuleIpv6"]
    description: >-
      Enable or disable an IPv6 firewall rule by PATCHing `enabled`; reuses
      `updateFirewallRuleIpv6` and adds no new endpoint.

  - name: firewall_rule_clone_ipv4
    domain: firewall_rules
    kind: mutation
    operation_ids: ["getFirewallRuleIpv4", "createFirewallRuleIpv4"]
    description: >-
      Clone an IPv4 rule: read the source with `getFirewallRuleIpv4`, then
      create a copy with `createFirewallRuleIpv4`.

  - name: firewall_rule_clone_ipv6
    domain: firewall_rules
    kind: mutation
    operation_ids: ["getFirewallRuleIpv6", "createFirewallRuleIpv6"]
    description: >-
      Clone an IPv6 rule: read the source with `getFirewallRuleIpv6`, then
      create a copy with `createFirewallRuleIpv6`.

  - name: audit_firewall_rules
    domain: audit
    kind: read
    operation_ids:
      - getAllZones
      - getAllFirewallRulesIpv4
      - getAllFirewallRulesIpv6
      - getAllNatRulesIpv4
      - getAllNatRulesIpv6
      - getAllIpAddresses
      - getAllIpv6Addresses
      - getAllFqdns
      - getAllIpv4AddressGroups
      - getAllIpv6AddressGroups
      - getAllFqdnGroups
      - getAllServices
      - getAllServiceGroups
    description: >-
      Read-only rule-base audit (any-any, disabled, shadowed/duplicate,
      no-logging, unused-object, nat-without-rule, unrestricted-service) with
      bounded findings and evidence; adds no new endpoint (#35).

  - name: explain_connectivity
    domain: audit
    kind: read
    operation_ids:
      - listNetworkInterfaces
      - getAllZones
      - getAllFirewallRulesIpv4
      - getAllFirewallRulesIpv6
      - getAllNatRulesIpv4
      - getAllNatRulesIpv6
      - getGatewaysIpv4
      - getGatewaysIpv6
      - getUnicastRoutesIPv4
      - getUnicastRoutesIPv6
    description: >-
      Read-only explanation of which interface/zone, firewall rule, NAT rule
      and route apply to a flow; reports `method: config-analysis` and
      `not-verifiable` when evidence is missing; adds no new endpoint (#35).

  - name: find_object_usage
    domain: audit
    kind: read
    operation_ids:
      - getAllIpAddresses
      - getAllIpv6Addresses
      - getAllFqdns
      - getAllServices
      - getAllFirewallRulesIpv4
      - getAllFirewallRulesIpv6
      - getAllNatRulesIpv4
      - getAllNatRulesIpv6
      - getAllIpv4AddressGroups
      - getAllIpv6AddressGroups
      - getAllFqdnGroups
      - getAllServiceGroups
    description: >-
      Read-only search for every rule, NAT entry and group that references an
      address, group or service; bounded scan with explicit truncation; adds no
      new endpoint (#35).

# ---------------------------------------------------------------------------
# Ordered exclusion rules. The tool map wins first; then these rules are
# evaluated in order; then the per-domain default_exclusion applies.
# All predicates present in a rule must match (logical AND).
# ---------------------------------------------------------------------------
exclusion_rules:
  - id: mac_bulk_delete
    applies: "`bulkDeleteMacAddresses`"
    operation_ids: ["bulkDeleteMacAddresses"]
    reason: "Bulk delete of MAC objects is excluded from v1; individual MAC CRUD is exposed (PLAN §4; #29)."

  - id: country_group_mutations
    applies: "mutations under `/network/address-groups/country`"
    path_prefix: "/network/address-groups/country"
    kind: "mutation"
    reason: "Country groups are read-only in v1; mutations are excluded (PLAN §4; #29)."

  - id: bulk_delete
    applies: "POST to any path ending in `/delete`"
    method: "POST"
    path_suffix: "/delete"
    reason: "Bulk delete excluded from v1: high blast radius and not required for individual CRUD (PLAN §4; #27-#31)."

  - id: administrators_crud
    applies: "path prefix `/authentication/users/administrators`"
    path_prefix: "/authentication/users/administrators"
    reason: "Administrator CRUD and privilege changes excluded from v1 for security impact (PLAN §4; #30)."

  - id: user_groups
    applies: "path prefix `/authentication/user-groups`"
    path_prefix: "/authentication/user-groups"
    reason: "User-group management and set-fallback-group excluded from v1 (PLAN §4; #30)."

  - id: admin_user_password
    applies: "path prefix `/authentication/admin-user`"
    path_prefix: "/authentication/admin-user"
    reason: "Administrator password change excluded from v1 (privilege impact)."

  - id: vpn_mutations
    applies: "mutations under `/ipsec-vpn` or `/ssl-vpn`"
    path_prefixes: ["/ipsec-vpn", "/ssl-vpn"]
    kind: "mutation"
    reason: "VPN v1 is read-only; no VPN mutation is registered (PLAN §4; #31)."

  - id: zones_mutations
    applies: "mutations under `/network/zones`"
    path_prefix: "/network/zones"
    kind: "mutation"
    reason: "Zones are read-only in v1; zone mutations are excluded (PLAN §4; #31)."

  - id: gateway_mutations
    applies: "mutations under `/routing/gateways` (WAN and custom gateways)"
    path_prefix: "/routing/gateways"
    kind: "mutation"
    reason: "Gateways are read-only in v1; WAN and custom gateway mutations are excluded (PLAN §4; #31)."

  - id: static_unicast_route_mutations
    applies: "mutations under `/routing/static-unicast-routes`"
    path_prefix: "/routing/static-unicast-routes"
    kind: "mutation"
    reason: "Static unicast routes are read-only in v1; route mutations are excluded (PLAN §4; #31)."

  - id: sdwan_route_mutations
    applies: "mutations and moves under `/sd-wan/routes`"
    path_prefix: "/sd-wan/routes"
    kind: "mutation"
    reason: "SD-WAN routes are read-only in v1; route mutations and moves are excluded (PLAN §4; #31)."

  - id: dhcp_mutations
    applies: "mutations under `/network/dhcp` (servers, relays, settings)"
    path_prefix: "/network/dhcp"
    kind: "mutation"
    reason: "DHCP servers, relays and settings are read-only in v1; mutations are excluded (PLAN §4; #31)."

  - id: dns_mutations
    applies: "mutations under `/network/dns` (settings, host entries, request routes)"
    path_prefix: "/network/dns"
    kind: "mutation"
    reason: "DNS settings, host entries and request routes are read-only in v1; mutations are excluded (PLAN §4; #31)."

  - id: static_neighbor_mutations
    applies: "mutations under `/network/neighbors/static`"
    path_prefix: "/network/neighbors/static"
    kind: "mutation"
    reason: "Static neighbors are read-only in v1; neighbor mutations are excluded (PLAN §4; #31)."

  - id: neighbor_settings_mutations
    applies: "mutations under `/network/neighbors/settings`"
    path_prefix: "/network/neighbors/settings"
    kind: "mutation"
    reason: "Neighbor settings are read-only in v1; the settings mutation is excluded (PLAN §4; #31)."

  - id: router_advertisements
    applies: "path prefix `/network/router-advertisements`"
    path_prefix: "/network/router-advertisements"
    reason: "Router advertisements are outside the v1 network read-only scope (PLAN §4; #31)."

  - id: multicast_routing
    applies: "path prefix `/routing/static-multicast-routes` or `/routing/static-multicast-settings`"
    path_prefixes:
      ["/routing/static-multicast-routes", "/routing/static-multicast-settings"]
    reason: "Multicast routing is outside the v1 network read-only scope (PLAN §4; #31)."

  - id: mdns_reflector
    applies: "path prefix `/network/mdns-reflector`"
    path_prefix: "/network/mdns-reflector"
    reason: "mDNS reflector configuration is outside the v1 network read-only scope (PLAN §4; #31)."

  - id: login_logout
    applies: "`networkUserLiveLogin`, `networkUserLiveLogout`"
    operation_ids: ["networkUserLiveLogin", "networkUserLiveLogout"]
    reason: "Network-user login/logout have operational side effects and are not registered in v1 (PLAN §4; #30)."

  - id: multipart_import
    applies: "`importTrustedMacs` (multipart/form-data)"
    operation_ids: ["importTrustedMacs"]
    reason: "Multipart import is outside the v1 JSON tool surface."

# Curated impact flags that cannot be derived from the HTTP shape alone.
risk:
  network_affecting:
    - createNetworkInterface
    - updateNetworkInterface
    - deleteNetworkInterface
    - connectCellularWan
    - disconnectCellularWan
    - resetCellularWan
    - patchCellularWanModemSettings
    - patchCellularWanSettings

# ---------------------------------------------------------------------------
# PATCH semantics and the four documented deviations.
# ---------------------------------------------------------------------------
patch:
  default_semantics: >-
    PATCH follows JSON Merge Patch (RFC 7396) by default: omitted properties
    keep their persisted values and `null` removes a property. This rule is
    reproduced verbatim in the contract's `info.description`.
  content_type_rule: >-
    All 134 PATCH operations declare `application/json`; none declares
    `application/merge-patch+json`. Do not change the Content-Type.
  exceptions:
    - operation_id: patchMessages
      path: "/administration/messages"
      deviation: "catalog-keyed by `name`; not a full-array replacement"
    - operation_id: updateCentralFirewallReportingLogComponents
      path: "/logging/log-destinations/central-firewall-reporting"
      deviation: "merge by `name`"
    - operation_id: updateSyslogServerLogs
      path: "/logging/log-destinations/syslog-servers/{idOrName}/logs"
      deviation: "merge by `name`"
    - operation_id: updateAlertNotificationSettings
      path: "/notification/notifications"
      deviation: "root booleans follow RFC 7396; `notifications[]` is catalog-keyed by `name`"

# ---------------------------------------------------------------------------
# Pagination rules.
# ---------------------------------------------------------------------------
pagination:
  declared_parameters: >-
    `page` (1-indexed, default 1), `pageSize` (default 50) and `pageTotal`
    (default false).
  declared_maximum: >-
    A `pageSize` maximum of 100 is declared only on `getUsers`,
    `getAdministrators` and `getNetworkUsers`.
  rules:
    - "Validate `page >= 1` before sending: the appliance accepts `page=0` with 200 but the contract requires `minimum: 1` (live observation 2026-11-15)."
    - "Validate `1 <= pageSize <= 100` before sending: the appliance returns 400 `invalidPageSizeParam` above 100 in every tested listing, including ones with no declared maximum."
    - "`pageTotal=true` adds `pages.total` and `pages.items` to the response (live observation 2026-11-15)."
    - "No `limit`, `offset` or cursor exists anywhere in the contract; do not invent one."
    - "Return one page per MCP call; do not auto-paginate or fetch every page."
    - "`/authentication/live-users` declares no page parameters; the appliance accepts them but v1 does not expose them (the contract stays authoritative)."

# ---------------------------------------------------------------------------
# Object identifiers and name formats.
# ---------------------------------------------------------------------------
identifiers:
  formats:
    - "`sfos-object-name`: valid UTF-8, no commas, semicolons, non-printable characters or leading/trailing spaces, and never a UUID."
    - "`sfos-object-name-or-id`: `sfos-object-name` or a UUID."
    - "`sfos-object-name-lenient`: like `sfos-object-name`, but commas and semicolons are allowed for pre-existing, built-in or localized objects."
    - "`sfos-object-name-lenient-or-id`: `sfos-object-name-lenient` or a UUID."
  rules:
    - "The operation's own path parameter and schema are authoritative; do not generalise across endpoints."
    - "POST bodies identify objects by unique name (`sfos-object-name`); GET/PATCH/DELETE paths use name-or-id."
    - "The `format` values are non-assertive: most `sfos-object-name*` schemas carry no `pattern`. The client must implement the documented validation itself."
    - "Do not treat display name, object ID and object reference as interchangeable."

# ---------------------------------------------------------------------------
# Responses, error envelopes and security.
# ---------------------------------------------------------------------------
errors:
  envelope: >-
    Every documented non-2xx response declares `application/json` with an
    object `{error (required), message, code}`.
  rules:
    - "Status codes are operation-specific; there is no universal status map. Follow the `responses` column of each row."
    - "Treat undocumented statuses as unexpected errors; do not invent envelopes or meanings."
    - "Live observation 2026-11-15: 401/400 and resource 404 are JSON; an unknown path returns 404 HTML; an unsupported method returns 405 plain text; PUT on a valid path returns 403 HTML. Sanitize and map per operation."
    - "Never return raw remote bodies or secrets in MCP errors."

security:
  contract: "Global HTTP Bearer (`bearerFormat: API key`); no operation overrides it."
  rules:
    - "Effective authorization comes from the Sophos administrator profile associated with the API key; the MCP tool surface is not an authorization boundary."
    - "Live tests use a dedicated read-only administrator and never attempt writes."
    - "Never expose or log the API key."

# ---------------------------------------------------------------------------
# Live observations that must be reflected in the coverage document.
# ---------------------------------------------------------------------------
live_observations:
  - id: live_users_pagination
    statement: >-
      `/authentication/live-users` accepts `page`, `pageSize` and `pageTotal`
      even though the contract declares no query parameters; `pageSize=101`
      returns 400 `invalidPageSizeParam`; the real `pages.maxSize` is 100, not
      the 1000 shown in an example.
    decision: >-
      v1 does not expose the undeclared parameters; the observation is
      recorded for #30 and the contract remains authoritative.
  - id: page_total
    statement: "`pageTotal=true` adds `pages.total` and `pages.items` (observed on users, firewall rules and live users)."
    decision: "Expose `pageTotal` where the contract declares it."
  - id: page_size_limit
    statement: "`pageSize` above 100 returns 400 `invalidPageSizeParam` in every tested listing, including ones with no declared maximum."
    decision: "Validate `1 <= pageSize <= 100` client-side."
  - id: page_zero
    statement: "`page=0` is accepted with 200 and `pages.current: 0` although the contract declares `minimum: 1`."
    decision: "Validate `page >= 1` client-side; do not replicate the laxity."
  - id: error_envelopes
    statement: "Error envelopes are not uniform: JSON for 401/400 and resource 404, HTML for an unknown path, plain text for 405, HTML for PUT."
    decision: "Sanitize and map per operation; never assume JSON."
  - id: firewall_rule_by_name
    statement: "`GET /firewall/rules/ipv4/{name}` works with the real name (spaces and dots, URL-encoded) and returns the full object."
    decision: "Name-or-id path parameters are usable with names; still accept UUIDs."
  - id: read_only_key
    statement: >-
      The lab key belongs to a dedicated `admin_mcp` administrator with the
      'Read only Admin' profile (47 read-only permissions, inferred). No write
      was attempted.
    decision: "Live tests stay read-only until the owner provides a write key and a disposable-object plan."
  - id: firmware_unknown
    statement: "The SFOS build is not exposed by the contract (`getSystemSettings` returns only hostname, loginDisclaimer and updatedAt)."
    decision: "Firmware compatibility remains unverified; live evidence must record the build when it becomes known."
  - id: phase3_live_run
    statement: >-
      Phase-3 read-only run (2026-11-15, `SOPHOS_READ_ONLY_MODE=true`, GET only):
      the 98 read-only tools produced 74 PASS, 24 SKIP (the appliance holds no
      object of that kind) and 0 FAIL. The appliance model and API
      allowlist source are not exposed by the API and remain unknown.
    decision: >-
      Recorded in `docs/live-evidence/phase-3-live-matrix.md`; no write
      behaviour is claimed. The 54 mutation tools remain contract-tested only.
  - id: empty_builtin_address_lists
    statement: >-
      `GET /network/addresses/ipv4|ipv6` returns `ipv4Addresses: []` /
      `ipv6Addresses: []` for the built-in `##ALL_RW`, `##ALL_IPSEC_RW` and
      `##ALL_SSLVPN_RW` objects, while the contract declares `minItems: 1`.
    decision: >-
      The output list models accept an empty list (documented deviation); the
      create/update input models keep `min_length=1`. Regression tests in
      `tests/test_live_deviations.py`.
  - id: empty_updated_at
    statement: >-
      `GET /network/dns/settings` returns `"updatedAt": ""` where the contract
      declares `format: date-time`.
    decision: >-
      The output model maps an empty string to `None` (documented deviation);
      any other non-date value still fails with a sanitized `ToolError`.

firmware:
  status: >-
    The lab appliance runs **SFOS 23.0.0 GA-Build371** (owner-provided on 2026-11-15; the
    contract exposes no version endpoint and `getSystemSettings` returns only
    `hostname`, `loginDisclaimer` and `updatedAt`). The live evidence applies to
    that build; no general firmware compatibility is claimed for other versions.
  live_evidence: "docs/live-evidence/api-smoke-2026-11-15.md, docs/live-evidence/phase-3-live-matrix.md"

# ---------------------------------------------------------------------------
# Accepted regressions: capabilities of the old XML tooling / Web Admin
# Console that the REST contract does not expose. They are accepted for v1 and
# are not hidden behind placeholder tools.
# ---------------------------------------------------------------------------
regressions:
  - id: system-information
    statement: >-
      The REST contract exposes no endpoint for appliance model, serial
      number, firmware version or uptime; `getSystemSettings` returns only
      `hostname`, `loginDisclaimer` and `updatedAt`.
    decision: >-
      Accepted regression: v1 does not expose system information. No
      placeholder tool is created; #32 records it in the release notes.

  - id: service-status
    statement: >-
      There is no REST endpoint that returns the running state of system
      services (SMB, NTP, SSH, etc.).
    decision: >-
      Accepted regression: v1 does not expose service status. Do not infer it
      from configuration endpoints.

  - id: log-query
    statement: >-
      The contract has no log query endpoint: log destinations can be
      configured, but logs cannot be read through this API.
    decision: >-
      Accepted regression: log analysis is out of v1 scope. Do not propose a
      log tool.
