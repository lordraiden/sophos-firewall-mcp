# Curated human decisions for docs/API-COVERAGE.md.
#
# This file holds ONLY decisions and prose written by people. Every generated
# fact (operation rows, counts, schemas, statuses, identifiers, pagination
# parameters) is derived from firewall_config_openapi.yaml by
# scripts/generate_coverage.py and must never be copied here.
#
# Edit this file, then regenerate:
#   uv run --no-sync python scripts/generate_coverage.py
#
# The generator refuses to write output when the specification SHA-256 differs
# from the embedded value unless --accept-sha is passed explicitly.

version: 1

release:
  phase: "Phase 2 (#27-#31, #35)"
  summary: >-
    145 operations and 152 MCP tools across 11 domains: firewall rules, NAT
    rules, addresses and address groups, services and service groups,
    authentication users, live users, read-only IPsec/SSL VPN, network
    architecture (read-only plus VLAN-only interface writes), two read-only
    status endpoints, and three read-only audit/composite tools. The 152 tools
    are 145 one-to-one tools plus 7 composite tools.
  rule: >-
    An operation is part of the v1 surface only when it appears in `tool_map`.
    Composite tools reuse those audited operations and add no new Sophos
    endpoint. Every other operation is listed with an explicit exclusion
    reason. Bulk delete is excluded everywhere. Tool names below are the
    intended v1 surface; the domain issues (#27-#31, #35) own the
    implementation and #32 owns the final reconciliation.

# ---------------------------------------------------------------------------
# Domain sections, in the canonical order used by the generated document.
# The path-to-domain mapping itself is derived by the generator and rendered
# in the document header; these blocks hold the decisions per domain.
# ---------------------------------------------------------------------------
domains:
  firewall_rules:
    title: "Firewall rules"
    v1_scope: >-
      Individual CRUD and move for IPv4 and IPv6 rules, plus two composite
      tools per family: enable/disable (`firewall_rule_set_enabled_*`, a PATCH
      of `enabled`) and clone (`firewall_rule_clone_*`, a get followed by a
      create). `enabled` and `position` are explicit inputs; a created rule is
      never auto-enabled.
    exclusions:
      - "Bulk delete (`bulkDeleteFirewallRulesIpv4/Ipv6`): high blast radius and not required for individual CRUD (PLAN §4)."
      - "WAF rule variant (`ruleType: waf`): create/update schemas are discriminated by `ruleType`; v1 tools accept only `ruleType: firewall` (PLAN §4; #27)."
    caveats:
      - "The contract has no firewall rule groups; do not infer them from other object groups."
      - "The list tools omit WAF items and report `wafRulesSkipped`, so the exclusion is visible rather than silent."
      - "`after`/`before` positions require `referenceItem` (semantic validation beyond the literal schema) to avoid a doomed request."
      - "`idOrName` values are rejected when they cannot be one URL path segment (no `/`, `\\`, `..`, `?`, `#`), so the failure is a clear validation error instead of a transport error."
      - "`move` changes rule ordering and is a separate operation (`moveFirewallRuleIpv4/Ipv6`)."
      - "The Firewall AI Assistant default (disabled, placed last) is not evidence for the REST POST default; represent and return the applied state explicitly."
      - "`firewall_rule_set_enabled_*` and `firewall_rule_clone_*` are composite tools over the audited operations; they add no new endpoint."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  nat_rules:
    title: "NAT rules"
    v1_scope: "Individual CRUD and move for IPv4 and IPv6 NAT rules."
    exclusions:
      - "Bulk delete (`bulkDeleteNatRulesIpv4/Ipv6`): excluded from v1 (PLAN §4)."
    caveats:
      - "NAT rules are not firewall-rule variants; the contract has no SNAT/DNAT discriminator."
      - "`linkedFirewallRule` is returned by the live appliance; do not assume it on create."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  addresses:
    title: "Addresses and address groups"
    v1_scope: >-
      IPv4, IPv6 and FQDN addresses and address groups: full CRUD. MAC
      addresses: full CRUD. Country groups: read-only (list and get).
    exclusions:
      - "Country group mutations (create/update/delete/bulk delete): country groups are read-only in v1 (PLAN §4; #29)."
      - "MAC bulk delete (`bulkDeleteMacAddresses`): excluded from v1; individual MAC CRUD is exposed (PLAN §4; #29)."
      - "Bulk delete of addresses and address groups: excluded from v1 (PLAN §4)."
    caveats:
      - "IPv4, IPv6, FQDN and MAC addresses have distinct schemas; do not merge them into one model."
      - "Groups are per family/type; do not assume mixed membership."
      - "Country groups are built-in/read-only: only list and get are exposed."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  services:
    title: "Services and service groups"
    v1_scope: "Services and service groups: list/get/create/update/delete."
    exclusions:
      - "Bulk delete of services and service groups: excluded from v1 (PLAN §4)."
    caveats:
      - "`getAllServices` accepts a `type` filter; services and service groups have different payloads."
      - "Do not reuse the service payload for service groups."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  auth_users:
    title: "Authentication users, administrators and groups"
    v1_scope: >-
      General user list (`getUsers`) and network-user CRUD (`getNetworkUsers`,
      `getNetworkUser`, `createNetworkUser`, `updateNetworkUser`,
      `deleteNetworkUser`).
    exclusions:
      - "Administrator CRUD (`/authentication/users/administrators`): excluded from v1 for privilege impact (PLAN §4; #30)."
      - "User groups and `setFallbackUserGroup` (`/authentication/user-groups`): excluded from v1 (PLAN §4; #30)."
      - "Administrator password change (`updateAdminUserPassword`): excluded from v1."
      - "Network-user login/logout (`networkUserLiveLogin`, `networkUserLiveLogout`): operational side effects; not registered in v1."
      - "Bulk delete of network users and administrators: excluded from v1."
    caveats:
      - "`getUsers` is the paginated general list; `getNetworkUsers` is the network-user collection. Do not conflate them."
      - "Passwords are write-only/sensitive; never return or log them."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  live_users:
    title: "Live users"
    v1_scope: "List active sessions (`getLiveUsers`) and disconnect one session (`disconnectLiveUser`)."
    exclusions:
      - "No bulk disconnect exists in the contract."
    caveats:
      - "The contract declares no page parameters, but the appliance accepts `page`/`pageSize`/`pageTotal` (live observation 2026-11-15); v1 does not expose them."
      - "`disconnectLiveUser` requires `liveUserId` (integer >= 1) and `message` (1-600 characters) and is destructive."
      - "Preserve the `pages` metadata exactly; do not invent a cursor or a page loop."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  ipsec_vpn:
    title: "IPsec VPN"
    v1_scope: >-
      Read-only: profiles, failover groups, site-to-site connections
      (policy-based and route-based, IPv4), live connections, and
      remote-access settings.
    exclusions:
      - "All IPsec mutations (create/update/delete/bulk delete): v1 VPN is read-only (PLAN §4; #31)."
    caveats:
      - "The contract has no IPv6 site-to-site connections."
      - "`connections/ipv4` exposes list and delete only; there is no create/update for that path."
      - "Distinguish configured connections from live connection state."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  ssl_vpn:
    title: "SSL VPN"
    v1_scope: >-
      Read-only: remote-access policies, clientless policies, bookmark
      groups, bookmarks, and global settings.
    exclusions:
      - "All SSL VPN mutations: v1 VPN is read-only (PLAN §4; #31)."
      - "SSL VPN site-to-site is not supported by SFOS 23 and is absent from the contract."
    caveats:
      - "Clientless bookmarks and bookmark groups are separate resources."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  network_status:
    title: "Network status"
    v1_scope: "Two read-only status endpoints: DNS protection status and cellular WAN modem status."
    exclusions:
      - "No generic firewall health endpoint exists; Firewall Health Check is a Web Admin Console compliance view, not this API."
    caveats:
      - "`getSystemSettings` returns only `hostname`, `loginDisclaimer` and `updatedAt`; do not promise model, serial number, firmware or uptime."
      - "There is no REST endpoint for system service status; see the accepted regressions."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  network:
    title: "Network"
    v1_scope: >-
      Read-only network architecture: interfaces, zones, gateways (IPv4/IPv6,
      WAN and custom), static unicast routes, SD-WAN routes, DHCP servers,
      leases and relays, DNS settings, host entries and request routes, and
      static neighbors. The only writes are VLAN-only interface operations
      (`network_interface_create_vlan`, `network_interface_update_vlan`,
      `network_interface_delete_vlan`).
    exclusions:
      - "Interface writes are VLAN-only: physical, bridge, LAG and XFRM interfaces are read-only in v1."
      - "Zone, gateway, static-route, SD-WAN, DHCP, DNS, neighbor and router-advertisement mutations are excluded from v1."
      - "Global DHCP server settings and neighbor settings are classified but not exposed."
    caveats:
      - "Physical, bridge, LAG and XFRM interfaces stay read-only because a wrong mutation can interrupt management connectivity. Update and delete pre-read the **target** interface with `getNetworkInterface` and refuse any type other than `vlan`; `deleteNetworkInterface` has no request body, so that pre-read is the only enforcement. Create cannot read the object it is about to create, so it pre-reads the **parent** interface (`parentInterface` must exist and be `physical`, `vlan`, `bridge` or `lag`; `cellularWan` and `xfrm` parents are refused) and always sends `type: vlan`."
      - "The network domain is the read-only architecture view; it is not a configuration editor for routing or DHCP."
      - "Distinguish configured routes and gateways from live state; the contract exposes no live routing table."
    default_exclusion: "Not in the v1 network scope: global settings reads and operations outside the read-only architecture view are classified here (PLAN §4; #31)."

  audit:
    title: "Audit (composite)"
    v1_scope: >-
      Three composite, read-only analysis tools (#35): `audit_firewall_rules`,
      `explain_connectivity` and `find_object_usage`. They call the audited
      list/get operations through the shared REST client and reason over the
      results; they add no new Sophos operation.
    exclusions:
      - "No Sophos operation is mapped 1:1 to this domain; the tools are composite by design."
    caveats:
      - "Composite tools are read-only and add no new endpoint; they must not invent data the API does not return."
      - "`explain_connectivity` is configuration analysis, not a packet test: it reports `method: config-analysis` and `not-verifiable` when the configuration is insufficient."
      - "Outputs are bounded and report truncation explicitly."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  admin_system:
    title: "Administration and system"
    v1_scope: "None in v1; classified for later phases."
    exclusions:
      - "Administration, notification and system settings are configuration writes with broad impact; deferred (PLAN §4)."
    caveats:
      - "`patchMessages`, `updateCentralFirewallReportingLogComponents`, `updateSyslogServerLogs` and `updateAlertNotificationSettings` document PATCH deviations; see the PATCH section."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

  other:
    title: "Other catalog"
    v1_scope: "None in v1; the remaining catalog is classified here for later phases."
    exclusions:
      - "Not in the v1 first-release scope (PLAN §4)."
    caveats:
      - "This section is the complete remainder of the contract; no operation is silently omitted."
    default_exclusion: "Not in the v1 first-release scope; classified for later phases (PLAN §4)."

